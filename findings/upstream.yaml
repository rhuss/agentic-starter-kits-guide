    quote: '# Also add to each agent in agents.list:'
  summary: The heartbeat fix uses the legacy `agents.list` key, which OpenClaw 2026.9
    migrates to keyed `agents.entries`.
  evidence: openclaw docs/gateway/doctor/config-migrations.md:399 maps `agents.list`
    to keyed `agents.entries`, and docs/gateway/heartbeat.md:96 names `agents.entries.*.heartbeat.every`.
  status: collected
- id: UF-29
  source: starter-kits
  kind: doc-drift
  locations:
  - ref: agents/openclaw/deployment/docs/troubleshooting.md:162
    quote: OpenClaw's heartbeat scheduler fires every 30 minutes by default, sending
      `HEARTBEAT_OK` messages to the chat.
  summary: The heartbeat flooding entry presents chat messages every 30 minutes as
    default behavior, but with the recipe's configuration (no channels, no owner)
    heartbeat polls are skipped.
  evidence: 'openclaw docs/gateway/heartbeat.md:97 ("Without a resolvable owner DM,
    ambient polls skip with `reason=no-route`") and :349 (the poll is skipped "before
    the agent runs"); the recipe sets `"channels": {}` (manifests/02-configmap.yaml:22).
    The entry should be scoped to deployments that set a heartbeat target or owner.'
  status: collected
