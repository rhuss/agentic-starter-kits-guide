- id: UF-24
  source: starter-kits
  kind: doc-drift
  locations:
  - ref: agents/openclaw/deployment/docs/raw-deployment.md:199
    quote: OpenClaw answers requests with forwarded headers from a proxy outside `gateway.trustedProxies`
