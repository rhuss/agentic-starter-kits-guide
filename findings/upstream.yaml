- id: UF-15
  source: starter-kits
  kind: bug
  locations:
  - ref: agents/openclaw/deployment/manifests/01-secret.yaml:10
    quote: 'OPENCLAW_GATEWAY_TOKEN: "CHANGE-ME"'
  summary: The Secret's placeholder token `CHANGE-ME` is not on OpenClaw's known-weak
    list, so a forgotten placeholder becomes a live gateway token.
  evidence: openclaw src/gateway/known-weak-gateway-secrets.ts:7-10 rejects only `change-me-to-a-long-random-token`
    and `change-me-now`. Suggest a placeholder OpenClaw rejects, or an empty value,
    plus a generation hint such as `openssl rand -hex 32` at docs/raw-deployment.md:120.
  status: collected
- id: UF-16
  source: starter-kits
  kind: dead-config
  locations:
  - ref: agents/openclaw/deployment/manifests/02-configmap.yaml:37
    quote: '"apiKey": "not-needed",'
  summary: 'The base ConfigMap''s `apiKey: not-needed` has no effect because the Deployment
    always sets VLLM_API_KEY from the Secret, and no doc explains this.'
  evidence: openclaw src/agents/model-auth-provider.ts:584-587 returns the provider
    env key before the configured literal key; manifests/04-deployment.yaml:92-96
    always sets VLLM_API_KEY. The tracing overlay already uses `"${VLLM_API_KEY}"`
    (overlays/mlflow-tracing/configmap-patch.yaml:36); docs/raw-deployment.md:82,104
    and overlays/example/configmap-patch.yaml:31 repeat `not-needed`.
  status: collected
