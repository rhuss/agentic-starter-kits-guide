# Upstream findings collected by cc-guide runs; file them with /guide:upstream.
findings:
- id: UF-1
  source: starter-kits
  kind: doc-drift
  locations:
  - ref: agents/openclaw/deployment/README.md:161
    quote: OpenShell's supervisor runs as PID 1 and ignores the image entrypoint.
  summary: The OpenShell notes say the supervisor runs as PID 1 in the sandbox, which
    does not match how OpenShell 0.1.2 runs on Kubernetes.
  evidence: openshell docs/about/architecture.mdx:104 (v0.1.2) puts the Kubernetes
    supervisor in its own pod, and docs/kubernetes/setup.mdx:21-23 says the driver
    creates a separate supervisor Pod; inside the workload, architecture/compute-runtimes.md:389,393-395
    has openshell-sandbox override the image command. The only PID 1 statement in
    OpenShell is for the VM runtime (compute-runtimes.md:305).
  status: collected
- id: UF-2
  source: starter-kits
  kind: doc-drift
  locations:
  - ref: agents/openclaw/deployment/README.md:163
    quote: Sandboxes created with OpenShell 0.0.x must be recreated after an upgrade
      to 0.1.
  summary: The upgrade note says to recreate 0.0.x sandboxes after the upgrade, while
    OpenShell says to remove them before it.
  evidence: 'openshell docs/upgrade/0-1-0.mdx:27 (v0.1.2): "Remove 0.0.x sandboxes
    before the upgrade and recreate them afterward."'
  status: collected
