- id: UF-18
  source: starter-kits
  kind: dead-config
  locations:
  - ref: agents/openclaw/deployment/manifests/04-deployment.yaml:83-84
    quote: '- name: OPENCLAW_CONFIG_DIR'
  summary: The Deployment sets OPENCLAW_CONFIG_DIR, which nothing in the OpenClaw
