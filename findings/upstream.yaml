- id: UF-27
  source: starter-kits
  kind: doc-drift
  locations:
  - ref: agents/openclaw/deployment/docs/troubleshooting.md:124
    quote: '**Fix:** Patch the ConfigMap with the correct model provider config, then
      restart:'
  - ref: agents/openclaw/deployment/docs/troubleshooting.md:172
    quote: '**Fix:** Set `heartbeat.every` to `"0m"` in the ConfigMap:'
  summary: The wrong-model and heartbeat fixes edit the ConfigMap and restart, which
    no longer changes a running deployment because the init container seeds `openclaw.json`
    only once.
  evidence: manifests/04-deployment.yaml:42-50 keeps an existing PVC copy ("Config
    exists, keeping it"), and docs/raw-deployment.md:205 says the ConfigMap is copied
    only on the first start; the fix should use `openclaw config patch`. The cause
    at troubleshooting.md:113 ("auto-generates its config on first start") predates
    the seed-once init container. The verification grep of `agent model` (:145) is
    written only at startup (openclaw src/gateway/server-startup-log.ts:117-128).
  status: collected
- id: UF-28
  source: starter-kits
  kind: stale-reference
  locations:
