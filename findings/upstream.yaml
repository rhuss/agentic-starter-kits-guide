- id: UF-9
  source: starter-kits
  kind: missing-doc
  locations:
  - ref: agents/openclaw/deployment/README.md:130
    quote: -- openclaw gateway --bind loopback --auth none --port 18789 --allow-unconfigured
  summary: The OpenShell sandbox section starts an unconfigured gateway and does not
    say how to give it a model provider, an API key, or that its configuration persists
    on /sandbox.
  evidence: No starter-kits doc covers configuring the sandboxed gateway; the guide
    run did it live with `openshell sandbox exec ... -- openclaw config patch --stdin`,
    which stores /sandbox/.openclaw/openclaw.json on the sandbox volume. For API keys,
    openshell docs/how-it-works/inference.mdx:128-134 (v0.1.2) requires an imported
    provider profile per self-hosted endpoint.
  status: collected
